<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f6f9;
        }

        header {
            background-color: #da251d;
            color: #ffff00;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.5rem;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #map {
            flex: 2;
            height: 100%;
            z-index: 1;
        }

        .sidebar {
            flex: 1;
            max-width: 420px;
            min-width: 320px;
            background: #ffffff;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 5px rgba(0,0,0,0.05);
            z-index: 2;
            position: relative;
        }

        .sidebar-header {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box:focus {
            border-color: #da251d;
        }

        /* Danh sách gợi ý tìm kiếm */
        .suggestions-list {
            position: absolute;
            top: 60px;
            left: 15px;
            right: 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 9999;
            display: none;
        }

        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
        }

        .suggestion-item:hover {
            background-color: #ffebee;
            color: #da251d;
            font-weight: bold;
        }

        .content-panel {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .placeholder-text {
            color: #777;
            text-align: center;
            margin-top: 40px;
            font-style: italic;
            line-height: 1.6;
        }

        .location-title {
            color: #da251d;
            font-size: 1.4rem;
            margin-bottom: 5px;
            border-bottom: 2px solid #da251d;
            padding-bottom: 5px;
        }

        .location-region {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .section {
            margin-bottom: 18px;
        }

        .section h3 {
            color: #333;
            font-size: 1.05rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section p {
            color: #444;
            line-height: 1.6;
            font-size: 0.92rem;
            text-align: justify;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #map { flex: 1; }
            .sidebar { max-width: 100%; height: 45vh; }
        }
    </style>
</head>

        // Hàm bỏ dấu tiếng Việt để tìm kiếm chuẩn xác 100% (vd: "hai phong" -> "Hải Phòng")
        function removeVietnameseTones(str) {
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            return str.toLowerCase().trim();
        }

        // Khởi tạo bản đồ
        const map = L.map('map').setView([16.0000, 107.5000], 6);

        // Map Tile CartoDB Voyager mượt và không bị lỗi 403
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const mapMarkers = [];

        // Hiển thị nội dung chi tiết
        function selectLocation(index) {
            const loc = locations[index];
            const detailsDiv = document.getElementById('details');
            
            detailsDiv.innerHTML = `
                <h2 class="location-title">${loc.name}</h2>
                <span class="location-region">${loc.region}</span>
                
                <div class="section">
                    <h3>🗺️ Địa lý:</h3>
                    <p>${loc.geo}</p>
                </div>
                
                <div class="section">
                    <h3>📜 Lịch sử:</h3>
                    <p>${loc.history}</p>
                </div>
            `;

            // Phóng to bản đồ tới tỉnh được chọn
            map.flyTo(loc.coords, 9, { duration: 1.2 });
            mapMarkers[index].openPopup();

            // Ẩn bảng gợi ý
            document.getElementById('suggestions').style.display = 'none';
        }

        // Tạo các ghim (markers) trên bản đồ
        locations.forEach((loc, index) => {
            const marker = L.marker(loc.coords).addTo(map);
            marker.bindPopup(`<b>${loc.name}</b><br><small>Nhấp để xem chi tiết</small>`);
            
            marker.on('click', () => {
                selectLocation(index);
            });

            mapMarkers.push(marker);
        });

        // Xử lý ô tìm kiếm chuẩn xác
        function onSearchInput() {
            const inputVal = document.getElementById('search').value;
            const cleanInput = removeVietnameseTones(inputVal);
            const sugBox = document.getElementById('suggestions');

            if (!cleanInput) {
                sugBox.style.display = 'none';
                return;
            }

            // Lọc địa điểm khớp với từ khóa (kể cả có dấu hay không dấu)
            const matches = locations.map((loc, idx) => ({ ...loc, originalIndex: idx }))
                .filter(loc => removeVietnameseTones(loc.name).includes(cleanInput));

            if (matches.length > 0) {
                sugBox.innerHTML = matches.map(item => 
                    `<div class="suggestion-item" onclick="selectLocation(${item.originalIndex}); document.getElementById('search').value='${item.name}';">
                        📍 <strong>${item.name}</strong> <small>(${item.region})</small>
                    </div>`
                ).join('');
                sugBox.style.display = 'block';
            } else {
                sugBox.innerHTML = `<div class="suggestion-item" style="color:#888;">Không tìm thấy tỉnh/thành phố nào!</div>`;
                sugBox.style.display = 'block';
            }
        }

        // Đóng gợi ý khi click ra ngoài
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.sidebar-header')) {
                document.getElementById('suggestions').style.display = 'none';
            }
        });
    </script>
